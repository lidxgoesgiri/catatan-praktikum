name: catatan-praktikum

services:
  app:
    build: .
    image: catatan-praktikum-app:local
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    environment:
      DB_HOST: database
      DB_DATABASE: ${DB_DATABASE:-catatan_praktikum}
      DB_USERNAME: ${DB_USERNAME:-catatan_user}
      DB_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di file .env}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/health.php') === 'OK' ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-catatan_praktikum}
      MYSQL_USER: ${DB_USERNAME:-catatan_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di file .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Isi MYSQL_ROOT_PASSWORD di file .env}
      MYSQL_INITDB_SKIP_TZINFO: "1"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - backend
    # Menguji login pengguna aplikasi DAN kesiapan tabel, bukan hanya proses MySQL.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysql --host=127.0.0.1 --user="$${MYSQL_USER}"
          --password="$${MYSQL_PASSWORD}" --database="$${MYSQL_DATABASE}"
          --execute="SELECT 1 FROM catatan LIMIT 1" > /dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  mysql_data:
